---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana

---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: longhorn
  namespace: longhorn-system
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  folderRef: longhorn
  instanceSelector:
    matchLabels:
      dashboards: grafana
  grafanaCom:
    id: 16888
