---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
  namespace: media
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        pod:
          securityContext:
            fsGroup: 568
        containers:
          main:
            image:
              repository: ghcr.io/navidrome/navidrome
              tag: 0.64.0
            securityContext:
              runAsUser: 568
              runAsGroup: 568
            env:
              TZ: America/Toronto
              ND_CACHEFOLDER: /cache
              # The inotify watcher never fires for writes other hosts make to
              # the NFS share, so new downloads need a periodic scan.
              ND_SCANNER_SCHEDULE: "@every 1h"

    ingress:
      main:
        enabled: true
        className: traefik
        hosts:
          - host: "navidrome.${domain}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main

    service:
      main:
        controller: main
        ports:
          http:
            port: 4533

    persistence:
      config:
        enabled: true
        existingClaim: navidrome-config
        globalMounts:
          - path: /data
      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /cache
      music:
        enabled: true
        type: custom
        volumeSpec:
          nfs:
            server: "${storage_host_ip}"
            path: /raid/network_share/media/Music
        globalMounts:
          - path: /music
            readOnly: true
