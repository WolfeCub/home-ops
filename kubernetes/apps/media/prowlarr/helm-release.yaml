---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        pod:
          securityContext:
            fsGroup: 568
        containers:
          main:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 2.6.2
            securityContext:
              runAsUser: 568
              runAsGroup: 568
            env:
              TZ: America/Toronto
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: "admin-tinyauth@kubernetescrd"
          tinyauth.apps.prowlarr.path.allow: "^/api.*$"
        hosts:
          - host: "prowlarr.${domain}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
    service:
      main:
        controller: main
        ports:
          http:
            port: 9696

    persistence:
      config:
        enabled: true
        existingClaim: prowlarr-config
