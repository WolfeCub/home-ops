---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wyoming
  namespace: home
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      speech:
        containers:
          # Parakeet STT, runs on the CPU
          parakeet:
            image:
              repository: rhasspy/wyoming-whisper
              tag: 3.8.1
            args: ["--language", "en"]
          # piper:
          #   image:
          #     repository: rhasspy/wyoming-piper
          #     tag: 2.2.2
          #   args: ["--voice", "en_US-hfc_female-medium", "--update-voices", "--use-cuda", "--debug"]
          #   env:
          #     NVIDIA_VISIBLE_DEVICES: all
          openwakeword:
            image:
              repository: rhasspy/wyoming-openwakeword
              tag: 2.1.0
            env:
              NVIDIA_VISIBLE_DEVICES: all
        pod:
          runtimeClassName: nvidia
          nodeSelector:
            kubernetes.io/hostname: worker04
          tolerations:
            - key: gpu
              operator: Exists

    service:
      parakeet:
        controller: speech
        ports:
          http:
            port: 10300

      # piper:
      #   controller: speech
      #   ports:
      #     http:
      #       port: 10200

      openwakeword:
        controller: speech
        ports:
          http:
            port: 10400

    persistence:
      parakeet-models:
        type: emptyDir
        advancedMounts:
          speech:
            parakeet:
              - path: /data
