---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wyoming
  namespace: home
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          # Parakeet STT, runs on the CPU
          parakeet:
            image:
              repository: rhasspy/wyoming-whisper
              tag: 3.8.1
            args:
              - --language
              - en
              - --stt-library
              - sherpa
              - --model
              - sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
          # Kokoro TTS via audio.cpp in llama-swap
          tts:
            image:
              repository: ghcr.io/roryeckel/wyoming_openai
              tag: 0.9.0
            env:
              WYOMING_URI: tcp://0.0.0.0:10200
              WYOMING_LANGUAGES: en
              TTS_BACKEND: OPENAI
              TTS_OPENAI_URL: http://llama-api.utils:8081/v1
              TTS_STREAMING_MODELS: kokoro
              # Neither audio.cpp nor this backend lists Kokoro's built-in voices
              TTS_VOICES: >-
                af_alloy af_aoede af_bella af_heart af_jessica af_kore af_nicole
                af_nova af_river af_sarah af_sky am_adam am_echo am_eric
                am_fenrir am_liam am_michael am_onyx am_puck am_santa
                bf_alice bf_emma bf_isabella bf_lily bm_daniel bm_fable
                bm_george bm_lewis
          openwakeword:
            image:
              repository: rhasspy/wyoming-openwakeword
              tag: 2.1.0
            env:
              NVIDIA_VISIBLE_DEVICES: all
          livekit-wakeword:
            image:
              repository: ghcr.io/wolfecub/wyoming-livekit-wakeword
              tag: 0.2.0
            env:
              LISTEN: 0.0.0.0:10401
        pod:
          runtimeClassName: nvidia
          nodeSelector:
            kubernetes.io/hostname: worker04
          tolerations:
            - key: gpu
              operator: Exists

    service:
      parakeet:
        controller: main
        ports:
          http:
            port: 10300

      tts:
        controller: main
        ports:
          http:
            port: 10200

      openwakeword:
        controller: main
        ports:
          http:
            port: 10400

      livekit-wakeword:
        controller: main
        ports:
          http:
            port: 10401

    persistence:
      parakeet-models:
        type: emptyDir
        advancedMounts:
          main:
            parakeet:
              - path: /data
