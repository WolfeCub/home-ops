---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speaches
  namespace: home
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/speaches-ai/speaches
              tag: 0.9.0-rc.3-cuda-12.6.3
            env:
              NVIDIA_VISIBLE_DEVICES: all
              # Forces the container to use your GPU
              WHISPER__INFERENCE_DEVICE: cuda
              # This sets the compute type to INT8 weights with FP16 activations
              WHISPER__COMPUTE_TYPE: int8_float16
              PRELOAD_MODELS: '["Systran/faster-whisper-medium.en", "Systran/faster-distil-whisper-large-v3", "speaches-ai/Kokoro-82M-v1.0-ONNX", "speaches-ai/piper-en_US-hfc_female-medium"]'
          wyoming-openai:
            image:
              repository: ghcr.io/roryeckel/wyoming_openai
              tag: 0.5.0
            env:
              WYOMING_LANGUAGES: en
              STT_BACKEND: "SPEACHES"
              TTS_BACKEND: "SPEACHES"
              STT_OPENAI_URL: http://localhost:8000/v1
              TTS_OPENAI_URL: http://localhost:8000/v1
              STT_MODELS: 'Systran/faster-distil-whisper-large-v3'
              # STT_STREAMING_MODELS: 'Systran/faster-whisper-medium.en'
              # TTS_MODELS: 'speaches-ai/Kokoro-82M-v1.0-ONNX speaches-ai/piper-en_US-hfc_female-medium'
              TTS_STREAMING_MODELS: 'speaches-ai/Kokoro-82M-v1.0-ONNX speaches-ai/piper-en_US-hfc_female-medium'

        pod:
          runtimeClassName: nvidia
          nodeSelector:
            kubernetes.io/hostname: worker04
          tolerations:
            - key: gpu
              operator: Exists

    service:
      main:
        controller: main
        ports:
          http:
            port: 8000
      wyoming-openai:
        controller: main
        ports:
          http:
            port: 10300

    persistence:
      downloads:
        type: emptyDir
        globalMounts:
          - path: /home/ubuntu/.cache/huggingface/hub/
