---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: speaches
  namespace: home
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/speaches-ai/speaches
              tag: 0.9.0-rc.3-cuda-12.6.3
            env:
              NVIDIA_VISIBLE_DEVICES: all
              PRELOAD_MODELS: '["speaches-ai/Kokoro-82M-v1.0-ONNX"]'
              # Never unload, so VRAM use stays constant
              TTS_MODEL_TTL: "-1"
          wyoming-openai:
            image:
              repository: ghcr.io/roryeckel/wyoming_openai
              tag: 0.7.0
            env:
              WYOMING_LANGUAGES: en
              TTS_BACKEND: "SPEACHES"
              TTS_OPENAI_URL: http://localhost:8000/v1
              TTS_STREAMING_MODELS: 'speaches-ai/Kokoro-82M-v1.0-ONNX'

        pod:
          runtimeClassName: nvidia
          nodeSelector:
            kubernetes.io/hostname: worker04
          tolerations:
            - key: gpu
              operator: Exists

    service:
      main:
        controller: main
        ports:
          http:
            port: 8000
      wyoming-openai:
        controller: main
        ports:
          http:
            port: 10300

    persistence:
      downloads:
        type: emptyDir
        globalMounts:
          - path: /home/ubuntu/.cache/huggingface/hub/
