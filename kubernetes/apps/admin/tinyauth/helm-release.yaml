---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tinyauth
  namespace: admin
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/tinyauthapp/tinyauth
              tag: v5.1.3
            env:
              TZ: America/Toronto
              TINYAUTH_APPURL: https://auth.${domain}
              TINYAUTH_LABELPROVIDER: kubernetes
              TINYAUTH_AUTH_SECURECOOKIE: "true"
              TINYAUTH_AUTH_TRUSTEDPROXIES: "10.42.0.0/16"
              TINYAUTH_AUTH_SESSIONEXPIRY: "2592000" # 30 days
              TINYAUTH_OAUTH_AUTOREDIRECT: pocketid
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME: "Pocket ID"
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID: tinyauth
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET: "${tinyauth_pocketid_client_secret}"
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL: https://id.${domain}/authorize
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL: https://id.${domain}/api/oidc/token
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL: https://id.${domain}/api/oidc/userinfo
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL: https://auth.${domain}/api/oauth/callback/pocketid
              TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES: "openid profile email groups"

    defaultPodOptions:
      automountServiceAccountToken: true

    serviceAccount:
      tinyauth:
        enabled: true

    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure-ext,websecure
        hosts:
          - host: "auth.${domain}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main

    service:
      main:
        controller: main
        ports:
          http:
            port: 3000

    persistence:
      data:
        enabled: true
        existingClaim: tinyauth-data
        globalMounts:
          - path: /data
