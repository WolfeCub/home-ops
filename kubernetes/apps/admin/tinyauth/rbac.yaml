---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tinyauth
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tinyauth
subjects:
  - kind: ServiceAccount
    name: tinyauth
    namespace: admin
roleRef:
  kind: ClusterRole
  name: tinyauth
  apiGroup: rbac.authorization.k8s.io
