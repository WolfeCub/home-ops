---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec
  namespace: admin
spec:
  plugin:
    bouncer:
      enabled: "true"
      crowdsecMode: stream
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-service.admin.svc.cluster.local:8080
      crowdsecLapiKey: "${crowdsec_bouncer_key}"
      # Fail open: a crowdsec outage must not 403 every external request.
      updateMaxFailure: "-1"
      streamStartupBlock: "false"
      forwardedHeadersTrustedIPs:
        - 10.42.0.0/16
      clientTrustedIPs:
        - 10.42.0.0/16
        - 192.168.0.0/16
