---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec-web-ui
  namespace: admin
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/theduffman85/crowdsec-web-ui
              tag: 2026.8.1
            env:
              TZ: America/Toronto
              CONFIG_UI_TIME_ZONE: America/Toronto
              # tinyauth is the gate, so the app keeps no accounts of its own.
              CONFIG_AUTH_ENABLED: "false"
              CONFIG_INSTANCE_LAPI_URL: http://crowdsec-service.admin.svc.cluster.local:8080
              CONFIG_INSTANCE_LAPI_AUTH_USERNAME: crowdsec-web-ui
              CONFIG_INSTANCE_LAPI_AUTH_PASSWORD: "${crowdsec_web_ui_password}"

    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: "admin-tinyauth@kubernetescrd"
        hosts:
          - host: "crowdsec.${domain}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main

    service:
      main:
        controller: main
        ports:
          http:
            port: 3000

    persistence:
      data:
        enabled: true
        existingClaim: crowdsec-web-ui-data
        globalMounts:
          - path: /app/data
