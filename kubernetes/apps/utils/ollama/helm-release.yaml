# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: utils
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        initContainers:
          model-puller:
            image:
              repository: ollama/ollama
              tag: 0.33.0
            env:
              OLLAMA_HOST: 0.0.0.0:11434
              NVIDIA_VISIBLE_DEVICES: "void"
            command:
              - /bin/bash
              - -c
              - |
                ollama serve &
                until ollama list >/dev/null 2>&1; do sleep 2; done

                ollama pull qwen3.5:9b
                ollama pull gemma4:12b
                ollama pull glm-ocr:q8_0

                ollama create qwen3.5:9b-150k -f <(cat <<'EOF'
                FROM qwen3.5:9b
                PARAMETER num_ctx 153600
                EOF
                )

                kill %1

        containers:
          webui:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.1
            env:
              WEBUI_AUTH_TRUSTED_EMAIL_HEADER: Remote-Email
              WEBUI_AUTH_TRUSTED_NAME_HEADER: Remote-User
              DATABASE_URL: sqlite:////app/backend/data/webui_db/webui.db
              OLLAMA_BASE_URL: http://localhost:11434
          ollama:
            image:
              repository: ollama/ollama
              tag: 0.33.0
            env:
              OLLAMA_HOST: 0.0.0.0:11434
              NVIDIA_VISIBLE_DEVICES: all
              # llama.cpp's prompt cache (context checkpoints) is host RAM, has
              # no per-model override, and never gets evicted while keep_alive
              # keeps a model loaded forever. The saved checkpoints from hours
              # of chat sat around unreclaimed, and a receipt upload's own
              # save pushed the node over — OOMKilled this pod once already.
              LLAMA_ARG_CACHE_RAM: "0"
        pod:
          runtimeClassName: nvidia
          nodeSelector:
            kubernetes.io/hostname: worker04
          tolerations:
            - key: gpu
              operator: Exists

    ingress:
      webui:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: "admin-tinyauth@kubernetescrd"
          tinyauth.apps.ollama.path.allow: "^/ollama/.*$"
        hosts:
          - host: "ollama.${domain}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: webui
    service:
      webui:
        controller: main
        ports:
          http:
            port: 8080
      api:
        controller: main
        ports:
          http:
            port: 11434

    persistence:
      models:
        enabled: true
        type: emptyDir
        advancedMounts:
          main:
            ollama:
              - path: /root/.ollama/models
            model-puller:
              - path: /root/.ollama/models

      data:
        enabled: true
        existingClaim: ollama-data
        advancedMounts:
          main:
            webui:
              - path: /app/backend/data/webui_db
                subPath: webui_db
                readOnly: false
              - path: /app/backend/data/vector_db
                subPath: vector_db
                readOnly: false
              - path: /app/backend/data/uploads
                subPath: uploads
                readOnly: false
