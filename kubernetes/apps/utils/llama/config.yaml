---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  namespace: utils
data:
  config.yaml: |
    # yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
    healthCheckTimeout: 300
    # List aliases like gemma4:12b-nothink in /v1/models so clients can pick them
    includeAliasesInList: true

    # Fixed sizes instead of --fit, which grabs whatever VRAM is free at load.
    macros:
      server: >-
        llama-server
        --host 127.0.0.1 --port $${PORT}
        --fit off --n-gpu-layers all
        --no-webui
        --cache-ram 0

    models:
      "gemma4:12b":
        cmd: |
          $${server}
          --model /models/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
          --mmproj /models/mmproj-F16.gguf
          --model-draft /models/mtp-gemma-4-12B-it.gguf
          --spec-type draft-mtp --spec-draft-n-max 4
          --n-gpu-layers-draft all
          --ctx-size 8192
          --parallel 4 --kv-unified
          --flash-attn on
          --cache-type-k q8_0 --cache-type-v q8_0
        filters:
          setParamsByID:
            "gemma4:12b-nothink":
              chat_template_kwargs:
                enable_thinking: false

      "glm-ocr:q8_0":
        cmd: |
          sh /etc/llama-swap/config/ocr-warmup.sh
          $${server}
          --model /models/GLM-OCR-Q8_0.gguf
          --mmproj /models/mmproj-GLM-OCR-Q8_0.gguf
          --ctx-size 8192
          --parallel 1
          --flash-attn on
          --cache-type-k q8_0 --cache-type-v q8_0
          # 28px per token, so ~a 1600px square: matches tally-ho's MAX_IMAGE_EDGE
          --image-max-tokens 3300

      "kokoro":
        cmd: |
          audiocpp_server
          --config /etc/llama-swap/config/audiocpp-server.json
          --port $${PORT}
          --no-ui

    routing:
      router:
        use: group
        settings:
          groups:
            resident:
              swap: false
              exclusive: false
              members:
                - "gemma4:12b"
                - "glm-ocr:q8_0"
                - "kokoro"

    hooks:
      on_startup:
        preload:
          - "gemma4:12b"
          - "glm-ocr:q8_0"
          - "kokoro"

  # text_chunk_size: Kokoro's VRAM grows with chunk length and is never freed. Tested next to
  # gemma and prewarmed glm-ocr: 80 peaks ~1.1 GiB with ~260 MiB to spare, 95+ OOMs.
  audiocpp-server.json: |
    {
      "host": "127.0.0.1",
      "backend": "cuda",
      "device": 0,
      "lazy_load": false,
      "models": [
        {
          "id": "kokoro",
          "family": "kokoro_tts",
          "path": "/models/Kokoro-82M-GGUF/kokoro-82m-bf16.gguf",
          "task": "tts",
          "mode": "offline",
          "default_voice_preset": {
            "voice_id": "af_heart"
          },
          "default_request_options": {
            "text_chunk_size": 80
          }
        }
      ]
    }

  ocr-warmup.sh: |
    #!/bin/sh
    log() { echo "ocr-warmup: $*" >&2; }
    prev=
    for arg in "$@"; do
      [ "$prev" = --port ] && port=$arg
      prev=$arg
    done
    "$@" &
    pid=$!
    trap 'log "got stop signal, stopping llama-server pid $pid"; kill -TERM $pid; wait $pid; exit' TERM INT
    log "started llama-server pid $pid, waiting for health on port $port"
    waited=0
    until curl -sf localhost:$port/health >/dev/null; do
      if ! kill -0 $pid 2>/dev/null; then
        log "llama-server exited before becoming healthy"
        exit 1
      fi
      sleep 1
      waited=$((waited + 1))
      [ $((waited % 15)) -eq 0 ] && log "still waiting for health after $waited seconds"
    done
    log "healthy after $waited seconds, sending 1600x1600 warmup image"
    start=$(date +%s)
    if curl -sSf --max-time 120 -o /dev/null localhost:$port/v1/chat/completions \
      -H 'Content-Type: application/json' -d @/etc/llama-swap/config/ocr-warmup.json; then
      log "warmup done in $(($(date +%s) - start)) seconds"
    else
      log "warmup failed with curl exit $?, stopping llama-server so it restarts clean"
      kill -TERM $pid
    fi
    wait $pid
    status=$?
    log "llama-server exited with status $status"
    exit $status

  ocr-warmup.json: |
    {"model": "glm-ocr:q8_0", "max_tokens": 1, "messages": [{"role": "user", "content": [{"type": "image_url", "image_url": {"url": "data:image/png;base64,"}}, {"type": "text", "text": "Text Recognition:"}]}]}
