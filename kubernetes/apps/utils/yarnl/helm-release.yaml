---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yarnl
  namespace: utils
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: titandrive/yarnl
              tag: 0.11.4
            env:
              TZ: America/Toronto
              NODE_ENV: production
              POSTGRES_HOST: postgres.admin.svc.cluster.local
              POSTGRES_PORT: 5432
              POSTGRES_USER: yarnl
              POSTGRES_DB: yarnl
              POSTGRES_PASSWORD: "${yarnl_postgres_password}"
              SECURE_COOKIES: true

    ingress:
      main:
        enabled: true
        className: traefik
        hosts:
          - host: "yarnl.${domain}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main

    service:
      main:
        controller: main
        ports:
          http:
            port: 3000

    persistence:
      data:
        enabled: true
        existingClaim: yarnl-data
        globalMounts:
          - path: /app/users
