---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omada
  namespace: utils
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: app-template
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: mbentley/omada-controller
              tag: 6.2-openj9
            env:
              TZ: America/Toronto

    defaultPodOptions:
      hostNetwork: true

    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          gatus.home-operations.com/enabled: "false"
        hosts:
          - host: "omada.${domain}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main

    service:
      main:
        controller: main
        ports:
          http:
            port: 8088
            protocol: HTTP

    persistence:
      omada:
        enabled: true
        existingClaim: omada-config
        globalMounts:
          - path: /opt/tplink/EAPController/data
            subPath: data
          - path: /opt/tplink/EAPController/logs
            subPath: logs
