---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omada
  namespace: utils
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: mbentley/omada-controller
              tag: 6.2-openj9
            env:
              TZ: America/Toronto
              SSL_CERT_NAME: tls.crt
              SSL_KEY_NAME: tls.key

    defaultPodOptions:
      hostNetwork: true

    service:
      main:
        controller: main
        annotations:
          traefik.ingress.kubernetes.io/service.serversscheme: https
        ports:
          http:
            port: 8043
            protocol: HTTPS

    persistence:
      omada:
        enabled: true
        existingClaim: omada-config
        globalMounts:
          - path: /opt/tplink/EAPController/data
            subPath: data
          - path: /opt/tplink/EAPController/logs
            subPath: logs
      tls:
        type: secret
        name: omada-tls
        globalMounts:
          - path: /cert
