---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trek
  namespace: utils
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: mauriceboe/trek
              tag: 4.3.3
            env:
              TZ: America/Toronto
              APP_URL: "https://trek.${domain}"
              ALLOWED_ORIGINS: "https://trek.${domain}"
              OIDC_ONLY: "true"
              OIDC_ADMIN_CLAIM: groups
              OIDC_ADMIN_VALUE: admin
              OIDC_SCOPE: "openid email profile groups"

    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure-ext,websecure
        hosts:
          - host: "trek.${domain}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main

    service:
      main:
        controller: main
        ports:
          http:
            port: 3000

    persistence:
      data:
        enabled: true
        existingClaim: trek-data
        globalMounts:
          - path: /app/data
            subPath: data
          - path: /app/uploads
            subPath: uploads
