---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  interval: 5m
  upgrade:
    force: true
  chart:
    spec:
      chart: crowdsec
      version: 0.24.0
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
      interval: 5m
  values:
    image:
      repository: crowdsecurity/crowdsec
      tag: v1.7.8

    container_runtime: containerd

    agent:
      acquisition:
        - namespace: admin
          podName: traefik-*
          program: traefik
      env:
        - name: TZ
          value: America/Toronto
        # Pulls in base-http-scenarios and http-cve transitively.
        - name: COLLECTIONS
          value: "crowdsecurity/traefik"

    lapi:
      env:
        - name: TZ
          value: America/Toronto
        - name: BOUNCER_KEY_traefik
          value: "${crowdsec_bouncer_key}"
        - name: WEB_UI_PASSWORD
          value: "${crowdsec_web_ui_password}"
      # The chart's LAPI entrypoint drops upstream's AGENT_USERNAME handling, so
      # the web UI's watcher is created here instead. -f /dev/null stops cscli
      # from clobbering local_api_credentials.yaml.
      lifecycle:
        postStart:
          exec:
            command:
              - /bin/bash
              - -c
              - |
                # postStart races the entrypoint writing /etc/crowdsec.
                for _ in $(seq 60); do
                  cscli machines add crowdsec-web-ui --force -f /dev/null \
                    --password "$WEB_UI_PASSWORD" && exit 0
                  sleep 2
                done
                echo "could not register the crowdsec-web-ui watcher" >&2
      persistentVolume:
        data:
          storageClassName: longhorn
        config:
          storageClassName: longhorn
